site_name: F1 Dashboard
site_description: Dashboard interativo de Fórmula 1 com dados da OpenF1 API.
site_authorr: Felipe Souza
repo_url: https://github.com/Felipedesouza92/F1.git
repo_name: Felipedesouza92/F1.git

theme:
  name: material
  language: pt
  palette:
    scheme: slate
    primary: red
    accent: red
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Início: index.md
  - Arquitetura: architecture.md
  - Estrutura do Projeto: project-structure.md
  - Como Rodar Local: running-locally.md
  - Como Rodar Testes: running-tests.md
  - Como Contribuir: contributing.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

