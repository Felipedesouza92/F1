[project]
name = "f1"
version = "0.1.0"
description = "Dashboard interativo de Fórmula 1 com dados da OpenF1 API."
authors = [
    {name = "Felipe de Souza", email = "felipe.desouza1992@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = ["httpx (>=0.28.1,<0.29.0)", "pydantic (>=2.14.1,<3.0.0)", "streamlit (>=1.66.1,<2.0.0)", "plotly (>=7.1.0,<8.0.0)", "python-dotenv (>=1.2.4,<2.0.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------- Poetry
[tool.poetry]
packages = [{include = "f1", from = "src"}]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "PTH",
    "BLE",
    "T20",
    "S",
    "PT",
    "D",
    "TID",
    "RUF",
]
ignore = [
    "E501",
    "D100",
    "D104",
    "D105",
    "D107",
    "D206",
    "D300",
    "W191",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "D",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["f1"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------- Pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov=src/f1",
    "--cov-report=term-missing",
    "--cov-fail-under=50",
]
markers = [
    "integration: testes que dependem de recursos externos (API real)",
]

# ---------------------------------------------------------------- Coverage
[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 50
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "taskipy (>=1.14.1,<2.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.17.0,<4.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "detect-secrets (>=1.5.0,<2.0.0)"
]
docs = [
    "mkdocs-material (>=9.8.0,<10.0.0)",
    "mkdocstrings[python] (>=1.0.8,<2.0.0)"
]

# ---------------------------------------------------------------- Taskipy
[tool.taskipy.tasks]
test = "pytest tests/unit/"
lint = "ruff check . && ruff format --check ."
format = "ruff check . --fix && ruff format ."
docs = "python -c \"import os, subprocess, sys; env = os.environ.copy(); env['NO_MKDOCS_2_WARNING'] = '1'; sys.exit(subprocess.run(['mkdocs', 'build', '-f', 'docs/mkdocs.yml', '--strict'], env=env).returncode)\""
docs-serve = "python -c \"import os, subprocess, sys; env = os.environ.copy(); env['NO_MKDOCS_2_WARNING'] = '1'; sys.exit(subprocess.run(['mkdocs', 'serve', '-f', 'docs/mkdocs.yml'], env=env).returncode)\""
